name: ci

on:
  push:
  pull_request:

jobs:
  gate-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Ratchet: a NEW .py file over 300 lines (not in the baseline) fails the build,
      # so the 61 pre-existing over-limit files cannot grow in number.
      - name: file-size ratchet gate
        run: python scripts/check_file_size.py

      # A self-contained core slice (no models, no network). Expand toward the full
      # tests/ suite as env-dependent tests are marked/skipped in CI.
      - name: tests (core slice)
        run: >
          python -m pytest -q
          tests/test_gateway.py
          tests/test_endpoint_registry.py
          tests/test_model_endpoint_profiles.py
          tests/test_file_size_gate.py
